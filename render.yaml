services:
  - type: web
    name: kirby-backend
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false   # Neon pooled connection string (DATABASE_URL in .env.local)
      - key: DATABASE_URL_UNPOOLED
        sync: false   # Neon direct connection string, used for migrations
      - key: KIRBY_ALLOWED_ORIGIN
        value: https://zakris.github.io
